<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1400" viewBox="0 0 2000 1400" role="img" aria-labelledby="title description">
<title id="title">World Bank Medallion Pipeline</title>
<desc id="description">World Bank API to Bronze JSON, Silver and Gold Parquet in HDFS, followed by Spark SQL and pandas Matplotlib analytics. Silver and Gold are written locally and uploaded through WebHDFS.</desc>
<rect width="2000" height="1400" fill="#F4F7FB"/>
<text x="100" y="65" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#3981A5" dominant-baseline="text-before-edge">WORLD BANK</text>
<text x="100" y="105" font-family="Segoe UI, Arial, sans-serif" font-size="56" font-weight="700" fill="#16324A" dominant-baseline="text-before-edge">Medallion Data Pipeline</text>
<text x="100" y="181" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="400" fill="#52677A" dominant-baseline="text-before-edge">Batch ingestion, transformation, storage and analytical exploration</text>
<rect x="100" y="255" width="1800" height="145" rx="22" fill="#16324A"/>
<text x="135" y="280" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#9ED3EA" dominant-baseline="text-before-edge">01  SOURCE AND INGESTION</text>
<text x="135" y="320" font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="700" fill="#FFFFFF" dominant-baseline="text-before-edge">World Bank Indicators API  →  Python requests</text>
<text x="135" y="365" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="400" fill="#D6E5EF" dominant-baseline="text-before-edge">8 indicators | 2010-2024 | Raw records and extraction metadata</text>
<polyline points="370,400 370,475" fill="none" stroke="#6F8598" stroke-width="5" stroke-linejoin="round"/>
<polygon points="370.00,475.00 380.00,456.00 360.00,456.00" fill="#6F8598"/>
<rect x="100" y="475" width="540" height="365" rx="22" fill="#FFFFFF" stroke="#D7E1EA" stroke-width="2"/>
<rect x="125" y="500" width="490" height="62" rx="13" fill="#E7C6A6"/>
<text x="146" y="515" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#16324A" dominant-baseline="text-before-edge">02  BRONZE</text>
<text x="132" y="588" font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="700" fill="#16324A" dominant-baseline="text-before-edge">Raw JSON</text>
<text x="132" y="637" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="400" fill="#52677A" dominant-baseline="text-before-edge">Original API records</text>
<text x="132" y="675" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="400" fill="#52677A" dominant-baseline="text-before-edge">Indicator and extraction metadata</text>
<text x="132" y="797" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#16324A" dominant-baseline="text-before-edge">Stored in HDFS via WebHDFS</text>
<rect x="730" y="475" width="540" height="365" rx="22" fill="#FFFFFF" stroke="#D7E1EA" stroke-width="2"/>
<rect x="755" y="500" width="490" height="62" rx="13" fill="#DBE3EA"/>
<text x="776" y="515" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#16324A" dominant-baseline="text-before-edge">03  SILVER</text>
<text x="762" y="588" font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="700" fill="#16324A" dominant-baseline="text-before-edge">Tabular Parquet</text>
<text x="762" y="637" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="400" fill="#52677A" dominant-baseline="text-before-edge">Expand JSON and cast data types</text>
<text x="762" y="675" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="400" fill="#52677A" dominant-baseline="text-before-edge">Normalize blanks and deduplicate</text>
<text x="762" y="797" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#16324A" dominant-baseline="text-before-edge">Local Parquet → WebHDFS upload</text>
<rect x="1360" y="475" width="540" height="365" rx="22" fill="#FFFFFF" stroke="#D7E1EA" stroke-width="2"/>
<rect x="1385" y="500" width="490" height="62" rx="13" fill="#F3DB91"/>
<text x="1406" y="515" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#16324A" dominant-baseline="text-before-edge">04  GOLD</text>
<text x="1392" y="588" font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="700" fill="#16324A" dominant-baseline="text-before-edge">Enriched Parquet</text>
<text x="1392" y="637" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="400" fill="#52677A" dominant-baseline="text-before-edge">Entity identifiers and classification</text>
<text x="1392" y="675" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="400" fill="#52677A" dominant-baseline="text-before-edge">Missing-value flags and decade</text>
<text x="1392" y="797" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#16324A" dominant-baseline="text-before-edge">Local Parquet → WebHDFS upload</text>
<polyline points="640,685 730,685" fill="none" stroke="#6F8598" stroke-width="5" stroke-linejoin="round"/>
<polygon points="730.00,685.00 711.00,675.00 711.00,695.00" fill="#6F8598"/>
<text x="645" y="648" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#52677A" dominant-baseline="text-before-edge">PySpark</text>
<polyline points="1270,685 1360,685" fill="none" stroke="#6F8598" stroke-width="5" stroke-linejoin="round"/>
<polygon points="1360.00,685.00 1341.00,675.00 1341.00,695.00" fill="#6F8598"/>
<text x="1275" y="648" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#52677A" dominant-baseline="text-before-edge">PySpark</text>
<polyline points="1630,840 1630,887 1000,887 1000,935" fill="none" stroke="#6F8598" stroke-width="5" stroke-linejoin="round"/>
<polygon points="1000.00,935.00 1010.00,916.00 990.00,916.00" fill="#6F8598"/>
<rect x="100" y="935" width="1800" height="230" rx="22" fill="#FFFFFF" stroke="#D7E1EA" stroke-width="2"/>
<text x="135" y="963" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="700" fill="#3981A5" dominant-baseline="text-before-edge">05  ANALYTICAL CONSUMPTION</text>
<text x="135" y="1010" font-family="Segoe UI, Arial, sans-serif" font-size="33" font-weight="700" fill="#16324A" dominant-baseline="text-before-edge">Spark SQL</text>
<text x="135" y="1060" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" fill="#52677A" dominant-baseline="text-before-edge">CTEs, window functions and aggregation</text>
<text x="135" y="1101" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" fill="#52677A" dominant-baseline="text-before-edge">Metrics and missing-value profiling</text>
<polyline points="900,1060 1015,1060" fill="none" stroke="#3981A5" stroke-width="5" stroke-linejoin="round"/>
<polygon points="1015.00,1060.00 996.00,1050.00 996.00,1070.00" fill="#3981A5"/>
<text x="1080" y="1010" font-family="Segoe UI, Arial, sans-serif" font-size="33" font-weight="700" fill="#16324A" dominant-baseline="text-before-edge">pandas + Matplotlib</text>
<text x="1080" y="1060" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" fill="#52677A" dominant-baseline="text-before-edge">Tabular results and descriptive analysis</text>
<text x="1080" y="1101" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" fill="#52677A" dominant-baseline="text-before-edge">8 saved charts in the academic notebook</text>
<text x="100" y="1210" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" fill="#16324A" dominant-baseline="text-before-edge">Execution environment</text>
<text x="100" y="1250" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" fill="#52677A" dominant-baseline="text-before-edge">Python + Java / Spark + Hadoop HDFS / WebHDFS</text>
<text x="100" y="1306" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400" fill="#52677A" dominant-baseline="text-before-edge">Silver and Gold storage steps follow the original notebook implementation.</text>
<text x="100" y="1344" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" fill="#52677A" dominant-baseline="text-before-edge">Academic snapshot | Diagram documents the code structure; the pipeline was not rerun.</text>
</svg>